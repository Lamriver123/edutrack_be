services:
  - type: web
    name: edutrack-be
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: JWT_REFRESH_COOKIE_NAME
        value: edutrack_refresh_token
      - key: JWT_REFRESH_COOKIE_SECURE
        value: 'true'
      - key: JWT_REFRESH_COOKIE_SAME_SITE
        value: none
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OTP_EXPIRES_MINUTES
        value: '5'
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: '60'
      - key: FRONTEND_URL
        sync: false
      # Keep the same VAPID pair across deploys; enter values in Render.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: VIETQR_ACCOUNT_LOOKUP_URL
        value: https://api.vietqr.io/v2/lookup
      - key: VIETQR_CLIENT_ID
        sync: false
      - key: VIETQR_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_STUDENT_AVATAR_FOLDER
        value: edutrack/student-avatars
      # My Drive backups use the owner's OAuth credentials.
      # Shared Drive deployments can set GOOGLE_SERVICE_ACCOUNT_KEY instead.
      - key: GOOGLE_DRIVE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_BACKUP_FOLDER_ID
        sync: false
      - key: BACKUP_MAX_COUNT
        value: '30'
      - key: BACKUP_CATCH_UP_ON_STARTUP
        value: 'true'
